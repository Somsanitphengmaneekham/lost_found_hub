  <g filter="url(#shadow)">
    <rect x="60" y="135" width="340" height="520" rx="4" fill="#ffffff" stroke="#183946" stroke-width="2"/>
<text x="78" y="169" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Profile card</text>
<text x="82" y="201" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Avatar image /</text>
<text x="82" y="225" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• initials</text>
<text x="82" y="249" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Full name</text>
<text x="82" y="273" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Role + identity</text>
<text x="82" y="297" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• status</text>
<text x="82" y="321" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Department</text>
<text x="82" y="345" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Student/employee code</text>
<rect x="430" y="135" width="710" height="315" rx="4" fill="#ffffff" stroke="#183946" stroke-width="2"/>
<text x="448" y="169" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Edit personal information</text>
<text x="452" y="201" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• First name, last name</text>
<text x="452" y="225" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Email, phone</text>
<text x="452" y="249" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Department</text>
<text x="452" y="273" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Save profile</text>
<rect x="430" y="480" width="340" height="175" rx="4" fill="#e7f7ef" stroke="#183946" stroke-width="2"/>
<text x="448" y="514" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Avatar upload</text>
<text x="452" y="546" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Choose profile image</text>
<text x="452" y="570" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• file</text>
<text x="452" y="594" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Preview before save</text>
<rect x="800" y="480" width="340" height="175" rx="4" fill="#fff4d8" stroke="#183946" stroke-width="2"/>
<text x="818" y="514" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Student card upload</text>
<text x="822" y="546" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Student only</text>
<text x="822" y="570" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Upload card for</text>
<text x="822" y="594" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• identity verification</text>
<rect x="60" y="690" width="1080" height="90" rx="4" fill="#f4f7f8" stroke="#183946" stroke-width="2"/>
<text x="78" y="724" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Security note</text>
<text x="82" y="756" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Teacher/admin verifies identity; contact data comes from registered</text>
