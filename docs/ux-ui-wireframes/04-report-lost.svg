<text x="832" y="201" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Use registered</text>
<rect x="60" y="245" width="720" height="500" rx="4" fill="#ffffff" stroke="#183946" stroke-width="2"/>
