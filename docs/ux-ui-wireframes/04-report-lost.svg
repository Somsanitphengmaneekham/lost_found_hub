<text x="82" y="311" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Item name, category</text>
<text x="82" y="335" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Expected lost location</text>
<text x="82" y="359" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Date + time</text>
<text x="82" y="383" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Description, color, brand, unique mark</text>
<text x="82" y="407" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Upload 1-3 image files</text>
<text x="82" y="431" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Cancel / Submit buttons</text>
<rect x="810" y="245" width="330" height="230" rx="4" fill="#fff4d8" stroke="#183946" stroke-width="2"/>
<text x="828" y="279" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Guide panel</text>
<text x="832" y="311" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Describe details</text>
<text x="832" y="335" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• clearly</text>
<text x="832" y="359" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Add photo evidence</text>
<text x="832" y="383" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Status becomes</text>
<text x="832" y="407" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• pending approval</text>
<rect x="810" y="505" width="330" height="240" rx="4" fill="#e7f7ef" stroke="#183946" stroke-width="2"/>
