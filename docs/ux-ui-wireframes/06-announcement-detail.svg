  <g filter="url(#shadow)">
    <rect x="60" y="135" width="520" height="420" rx="4" fill="#ffffff" stroke="#183946" stroke-width="2"/>
<text x="78" y="169" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Image gallery</text>
<text x="82" y="201" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Large selected image</text>
<text x="82" y="225" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Thumbnail images 1-3</text>
<rect x="610" y="135" width="530" height="420" rx="4" fill="#ffffff" stroke="#183946" stroke-width="2"/>
<text x="628" y="169" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Item information</text>
<text x="632" y="201" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Title, status, type: lost/found</text>
<text x="632" y="225" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Category, location, date/time</text>
<text x="632" y="249" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Color, brand, unique mark</text>
<text x="632" y="273" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Description</text>
<rect x="60" y="585" width="520" height="185" rx="4" fill="#fff4d8" stroke="#183946" stroke-width="2"/>
<text x="78" y="619" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Owner/finder safety note</text>
<text x="82" y="651" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Show only safe contact flow</text>
<text x="82" y="675" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• No public sensitive identity</text>
<rect x="610" y="585" width="530" height="185" rx="4" fill="#e7f7ef" stroke="#183946" stroke-width="2"/>
<text x="628" y="619" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#14323b">Action area</text>
<text x="632" y="651" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Student: view status / claim</text>
<text x="632" y="675" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• request</text>
<text x="632" y="699" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• Teacher: approve/reject/return</text>
<text x="632" y="723" text-anchor="start" font-family="Noto Sans Lao, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b7078">• shortcuts</text>
  </g>
